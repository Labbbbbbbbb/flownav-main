project_name: flownav
entity: zyt115200-harbin-institute-of-technology
run_name: flownav

# training setup
use_wandb: True# set to false if you don't want to log to wandb
train: True
cfg_w: 0.5 # weight for the CFG loss added by zyt，0代表完全用n-x，1代表完全用model output
p_mean: -0.4 # mean for normalizing the action space added by zyt
p_std: 1.0 # std for normalizing the action space added by zyt
batch_size: 64    #爆显存了，原来两个batch size都是512
eval_batch_size: 64 
epochs: 30
gpu_ids: [1]
num_workers: 8
lr: 1e-4
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine"
warmup: True 
warmup_epochs: 4
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 0

# model params
model_type: nomad
vision_encoder: nomad_vint
encoding_size: 256
obs_encoder: efficientnet-b0
attn_unet: False
cond_predict_scale: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]
obs_type: image
goal_type: image

# depth
depth:
  depth_encoder: vits
  dino_layer_idx: 
    vits: [2, 5, 8, 11]
  pool_dim: 64
  out_dim: 
    vits: 384
  weights_path: /data/flownav_dataset/pretrain_weights/depth_anything_v2_vits.pth

# mask 
goal_mask_prob: 0.5

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 3 # 5
alpha: 1e-4

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

# action output params
len_traj_pred: 8
learn_angle: False

# dataset specific parameters
image_size: [96, 96] # width, height
datasets:
  #  recon:
  #   data_folder: /data/flownav_dataset/datasets/recon
  #   train: /data/flownav_dataset/data_splits/recon/train/ # path to train folder with traj_names.txt
  #   test: /data/flownav_dataset/data_splits/recon/test/ # path to test folder with traj_names.txt
  #   end_slack: 3 # because many trajectories end in collisions
  #   goals_per_obs: 1 # how many goals are sampled per observation
  #   negative_mining: True # negative mining from the ViNG paper (Shah et al.)
  #   waypoint_spacing: 1
  #  custom:
  #   data_folder: /data/flownav_dataset/datasets/custom_4_29
  #   train: /data/flownav_dataset/data_splits/custom_4_29/train/ # path to train folder with traj_names.txt
  #   test: /data/flownav_dataset/data_splits/custom_4_29/test/ # path to test folder with traj_names.txt
  #   end_slack: 3
  #   goals_per_obs: 2 # increase dataset size
  #   negative_mining: True
  #   waypoint_spacing: 1
   custom_05_23:
    data_folder: /data/flownav_dataset/datasets/custom_05_23
    train: /data/flownav_dataset/data_splits/custom_05_23/train/ # path to train folder with traj_names.txt
    test: /data/flownav_dataset/data_splits/custom_05_23/test/ # path to test folder with traj_names.txt
    end_slack: 3
    goals_per_obs: 2 # increase dataset size
    negative_mining: True
    waypoint_spacing: 1
  #  huron:
  #   data_folder: /data/flownav_dataset/datasets/huron
  #   train: /data/flownav_dataset/data_splits/huron/train/ # path to train folder with traj_names.txt
  #   test: /data/flownav_dataset/data_splits/huron/test/ # path to test folder with traj_names.txt
  #   end_slack: 3
  #   goals_per_obs: 1 # increase dataset size
  #   negative_mining: True
  #   waypoint_spacing: 1
# logging stuff
## =0 turns off
print_log_freq: 500 # in iterations
image_log_freq: 1000 #1000 # in iterations
num_images_log: 8 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
wandb_log_freq: 10 # in iterations
eval_freq: 1 # in epochs

