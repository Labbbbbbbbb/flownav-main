# Camera intrinsics for trajectory projection
# Obtain these via OpenCV camera calibration:
# https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html

deploy:
  camera_metrics:
    # physical mounting
    camera_height: 0.4446      # camera height above ground (meters)
    camera_x_offset: 0.3612    # distance from robot center to camera along forward axis (meters)

    # intrinsic matrix (from calibration)
    camera_matrix:
      fx: 386.548   # focal length x (pixels)
      fy: 386.171   # focal length y (pixels)
      cx: 328.326     # principal point x (pixels)
      cy: 243.573     # principal point y (pixels)

    # distortion coefficients (from calibration, set to 0 if unknown)
    dist_coeffs:
      k1: -0.054461  # radial distortion
      k2: 0.063385  # radial distortion
      p1: 0.000409   # tangential distortion
      p2: 0.000540  # tangential distortion
      k3: -0.019851        # radial distortion
